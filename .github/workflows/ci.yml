name: Linux Server Manager CI

on:
  push:
    branches: [main, "fix/**", "feat/**", "test/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend, frontend and scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate shell scripts
        run: bash -n ../scripts/*.sh ../scripts/lib/*.sh

      - name: Test startup API identity checks
        run: bash ../scripts/test-api-health.sh

      - name: Test startup dashboard identity checks
        run: bash ../scripts/test-web-health.sh

      - name: Test controlled recovery rollback
        run: bash ../scripts/test-recovery.sh

      - name: Test safe service shutdown
        run: bash ../scripts/test-stop.sh

      - name: Test LinuxCore supervisor
        run: bash ../scripts/test-supervisor.sh

      - name: Test systemd user-service installer
        run: bash ../scripts/test-user-service-installer.sh

      - name: Validate frontend and Vercel gateway JavaScript
        run: |
          node --check ../frontend/app.js
          node --check ../api/_lib/gateway.js
          node --check '../api/[...path].js'

      - name: Test authenticated Vercel gateway
        run: node --test ../scripts/test-vercel-gateway.cjs

      - name: Verify dashboard live-data contract
        run: bash ../scripts/test-frontend-contract.sh

      - name: Run local security checks
        run: bash ../scripts/security-check.sh

      - name: Run local end-to-end smoke test
        run: |
          set -euo pipefail
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 >/tmp/linuxcore-api.log 2>&1 &
          API_PID=$!
          python -m http.server 8080 --directory ../frontend --bind 127.0.0.1 >/tmp/linuxcore-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" "$API_PID" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              ready=true
              break
            fi
            sleep 0.5
          done
          [[ "$ready" == true ]] || { cat /tmp/linuxcore-api.log /tmp/linuxcore-web.log; exit 1; }
          bash ../scripts/smoke-test.sh

      - name: Run backend tests
        run: pytest -q
